# pnpm workspace 根配置
#
# 只有 apps/ 与 packages/ 归 pnpm 管；
# servers/forever-server 是 Maven 工程，**不在这里**——两者只在 CI 层并行，不在任务图里耦合。
packages:
  - apps/*
  - packages/*

# pnpm 10 默认拦截依赖的 postinstall；这几个必须放行，否则二进制不会被下载：
#   esbuild   —— vite / rolldown 依赖它，被拦则构建直接失败
#   core-js-pure —— postinstall 只是打印捐赠提示，放行只为消掉告警
onlyBuiltDependencies:
  - esbuild
  - core-js-pure
  - '@parcel/watcher'
  - unrs-resolver

# ⚠️ overrides **不要写在本文件里**，写在根 package.json 的 pnpm.overrides。
#
# 实测（pnpm 10.12.1）：本文件的 overrides 会被原样抄进 lockfile 头部，但**解析时不生效**，
# 传递依赖照样漂版本（@tiptap 那两个依旧是 3.31.3）。换到 package.json 的 pnpm.overrides
# 才真正生效。另外 override 的 key 要用**精确包名**——`@tiptap/*` 这种通配符同样不生效。
#
# 现有 override 见 package.json，原因是 apps/web 把 11 个 @tiptap 包钉死在 3.30.2，
# 而它自己的传递依赖写的是 caret，重新生成 lockfile 就会漂到 3.31.x，
# 造成 @tiptap/pm 3.30.2 与 bubble-menu 3.31.3 混装。

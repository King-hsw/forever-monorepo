name: 构建镜像 · server

# push main/release 分支、打 v* 标签，或手动触发
#
# ⚠️ paths 只留 servers/forever-server/** —— apps/ 前端目录变化要触发
#    **前端**镜像重建，跟后端无关，别把依赖图写反。
on:
  push:
    branches: [main, release]
    tags: ['v*']
    paths:
      - 'servers/forever-server/**'
      - '.github/workflows/build-server.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 合仓后 GITHUB_REPOSITORY 变成 monorepo 的名字，这里必须写死，
  # 否则镜像地址会变、老部署拉不到
  IMAGE: ghcr.io/king-hsw/forever-server

jobs:
  build:
    strategy:
      matrix:
        include:
          # 各平台跑在原生架构的 Runner 上，无需 QEMU 模拟
          - platform: linux/amd64
            runner: ubuntu-latest
            short: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm # 公开仓库免费
            short: arm64
    runs-on: ${{ matrix.runner }}
    # 后端是独立 Maven 工程，所有 shell 步骤都在它自己的目录里跑
    defaults:
      run:
        working-directory: servers/forever-server
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Dockerfile 只拷分层产物（构建阶段已移出镜像）：每个平台 job 先 mvn 打包
      # + 分层展开，产物落在工作区即进入 buildx 构建上下文
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          maven-version: '3.9'
          cache: maven

      - name: mvn package
        run: mvn -B package -DskipTests

      # 与 .cnb.yml 同款：Dockerfile 按层 COPY extracted/（见其中注释）
      - name: extract layers
        run: java -Djarmode=tools -jar target/forever-server-*.jar extract --layers --launcher --destination extracted

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并按摘要推送
        id: build
        uses: docker/build-push-action@v6
        with:
          # 后端的构建上下文就是它自己的目录（Dockerfile 拷的是同目录下的 extracted/）
          context: servers/forever-server
          file: servers/forever-server/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=server-build-${{ matrix.short }}
          cache-to: type=gha,scope=server-build-${{ matrix.short }},mode=max

      - name: 导出摘要
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: server-digests-${{ matrix.short }} # 产物名不能带斜杠，用短名
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # 等两个平台都构建完，把摘要拼成多架构清单后统一打 tag 推送
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: server-digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建多架构清单并推送
        working-directory: /tmp/digests
        run: |
          TAGS="-t $IMAGE:latest"
          # tag 触发时（refs/tags/v*）额外打版本号 tag
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAGS="$TAGS -t $IMAGE:${GITHUB_REF#refs/tags/}"
          fi
          # 刚按摘要推送的清单要一会儿才能按摘要读到（GHCR 最终一致性延迟），带重试
          ok=0
          for i in 1 2 3 4 5 6; do
            if docker buildx imagetools create $TAGS $(printf "$IMAGE@sha256:%s " *); then ok=1; break; fi
            echo "::warning::摘要暂不可读（GHCR 一致性延迟），15s 后重试（$i/6）"
            sleep 15
          done
          [[ $ok == 1 ]] || exit 1

      - name: 检查清单
        run: docker buildx imagetools inspect $IMAGE:latest

name: 构建镜像 · web

# push main/release 分支、打 v* 标签，或手动触发
#
# paths 过滤：只在 apps/web 或公共前端代码变化时才构建 web 镜像。
# ⚠️ 如果你在 GitHub 上给 main 开了分支保护、并把本 workflow 设成「必需检查」，
#    那么不匹配 paths 的 PR 永远不会触发它，检查会一直 pending → PR 卡死。
#    这种情况改成「始终触发 + job 内用 dorny/paths-filter 判断后决定要不要构建」。
on:
  push:
    branches: [main, release]
    tags: ['v*']
    paths:
      - 'apps/web/**'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # ghcr 要求镜像名全小写；合仓后 GITHUB_REPOSITORY 变成 monorepo 的名字，
  # 所以这里必须写死，否则镜像地址会变、老部署拉不到
  IMAGE: ghcr.io/king-hsw/forever

jobs:
  build:
    # 每个平台一个 job 并行构建；单平台镜像先按「摘要」推送，
    # 不打 tag，避免与另一个 job 互相覆盖
    strategy:
      matrix:
        include:
          # 各平台跑在原生架构的 Runner 上，无需 QEMU 模拟
          - platform: linux/amd64
            runner: ubuntu-latest
            short: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm # 公开仓库免费
            short: arm64
    runs-on: ${{ matrix.runner }}
    # web 是独立工程：所有 shell 步骤都在它自己的目录里跑
    defaults:
      run:
        working-directory: apps/web
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 锁版本，与 .cnb.yml 和 apps/web/package.json 的 packageManager 保持一致
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # Dockerfile 只拷 .output/（构建阶段已移出镜像）：
      # 每个平台 job 先构建，产物落在工作区即进入 buildx 构建上下文
      - name: pnpm build
        run: pnpm build
        env:
          NODE_ENV: production

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并按摘要推送
        id: build
        uses: docker/build-push-action@v6
        with:
          # 构建上下文是 apps/web 自身（Dockerfile 拷的是它里面的 .output/）
          context: apps/web
          file: apps/web/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=web-build-${{ matrix.short }}
          cache-to: type=gha,scope=web-build-${{ matrix.short }},mode=max

      - name: 导出摘要
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: web-digests-${{ matrix.short }} # 产物名不能带斜杠，用短名
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # 等两个平台都构建完，把摘要拼成多架构清单后统一打 tag 推送
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: web-digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建多架构清单并推送
        working-directory: /tmp/digests
        run: |
          TAGS="-t $IMAGE:latest"
          # tag 触发时（refs/tags/v*）额外打版本号 tag
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAGS="$TAGS -t $IMAGE:${GITHUB_REF#refs/tags/}"
          fi
          # 刚按摘要推送的清单要一会儿才能按摘要读到（GHCR 最终一致性延迟），带重试
          ok=0
          for i in 1 2 3 4 5 6; do
            if docker buildx imagetools create $TAGS $(printf "$IMAGE@sha256:%s " *); then ok=1; break; fi
            echo "::warning::摘要暂不可读（GHCR 一致性延迟），15s 后重试（$i/6）"
            sleep 15
          done
          [[ $ok == 1 ]] || exit 1

      - name: 检查清单
        run: docker buildx imagetools inspect $IMAGE:latest

name: 构建镜像

# push main/release 分支（paths 分侧：只构建改动侧）、打 v* 标签（不受 paths 拦截，双侧全量发版），或手动触发
on:
  push:
    branches: [main, release]
    paths: ['apps/web/**', '.github/workflows/web.yml']
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # ghcr 要求镜像名全小写；嵌套名需先在 GHCR 预建父包 king-hsw/forever-monorepo
  IMAGE: ghcr.io/king-hsw/forever-monorepo/web

jobs:
  build:
    # 每个平台一个 job 并行构建；单平台镜像先按「摘要」推送，
    # 不打 tag，避免与另一个 job 互相覆盖
    strategy:
      matrix:
        include:
          # 各平台跑在原生架构的 Runner 上，无需 QEMU 模拟
          - platform: linux/amd64
            runner: ubuntu-latest
            short: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm # 公开仓库免费
            short: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Dockerfile 只拷 .output/（构建阶段已移出镜像）：每个平台 job 先 pnpm 构建，
      # 产物落在工作区即进入 buildx 构建上下文
      - uses: pnpm/action-setup@v4
        with:
          # 锁死 pnpm 版本（与原 Dockerfile 一致），避免上游发新版导致构建行为变化
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: pnpm install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: pnpm build
        working-directory: apps/web
        run: pnpm build
        env:
          NODE_ENV: production

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并按摘要推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.short }}
          cache-to: type=gha,scope=build-${{ matrix.short }},mode=max

      - name: 导出摘要
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.short }} # 产物名不能带斜杠，用短名
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # 等两个平台都构建完，把摘要拼成多架构清单后统一打 tag 推送
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建多架构清单并推送
        working-directory: /tmp/digests
        run: |
          # 分支事件只动 latest；tag 事件只打版本 tag（不动 latest，避免旧 commit 覆盖）
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAGS="-t $IMAGE:${GITHUB_REF#refs/tags/}"
          else
            TAGS="-t $IMAGE:latest"
          fi
          # 刚按摘要推送的清单要一会儿才能按摘要读到（GHCR 最终一致性延迟），带重试
          ok=0
          for i in 1 2 3 4 5 6; do
            if docker buildx imagetools create $TAGS $(printf "$IMAGE@sha256:%s " *); then ok=1; break; fi
            echo "::warning::摘要暂不可读（GHCR 一致性延迟），15s 后重试（$i/6）"
            sleep 15
          done
          [[ $ok == 1 ]] || exit 1

      - name: 检查清单
        # tag 事件时检查本次推的版本 tag，分支事件检查 latest
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker buildx imagetools inspect "$IMAGE:${GITHUB_REF#refs/tags/}"
          else
            docker buildx imagetools inspect "$IMAGE:latest"
          fi




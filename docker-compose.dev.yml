# 本地开发基础设施:数据库 + 文件存储 + 邮件
# 用法:docker compose -f docker-compose.dev.yml up -d
# 停止:docker compose -f docker-compose.dev.yml down
#
# 端口:
#   PostgreSQL  5432  (postgres/mysecretpassword, db=forever)
#   RustFS      9000  (S3 API)  /  9001  (Web Console)
#   Mailpit     1025  (SMTP)    /  8025  (Web UI)
#
# 与 apps/server/.env.example 中的默认值完全对齐,无需改 .env 即可启动。

services:
  postgres:
    image: postgres:16-alpine
    container_name: forever-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: forever
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # RustFS 是 MinIO 的 Rust 重写版,CLI/环境变量沿用 MinIO 约定
  rustfs:
    image: rustfs/rustfs:latest
    container_name: forever-rustfs
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rustfsadmin
      MINIO_ROOT_PASSWORD: rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfsdata:/data

  # 注:桶 forever 不再自动创建，首次需在 RustFS Console (http://localhost:9001) 手动建桶并设公开读

  mailpit:
    image: axllent/mailpit:latest
    container_name: forever-mailpit
    # 应用侧 smtp.auth=true 但本地 1025 是明文连接，需允许不安全认证
    command: --smtp-auth-allow-insecure
    environment:
      # 应用侧 smtp.auth=true，让 Mailpit 接受任意账密（本地开发专用）
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_NO_AUTH: 1
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI (查看收到的邮件)
    volumes:
      - mailpitdata:/data

volumes:
  pgdata:
  rustfsdata:
  mailpitdata:

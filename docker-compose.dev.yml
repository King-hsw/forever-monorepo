# 本地开发基础设施:数据库 + 文件存储 + 邮件
# 用法:docker compose -f docker-compose.dev.yml up -d
# 停止:docker compose -f docker-compose.dev.yml down
#
# 端口:
#   PostgreSQL  5432  (postgres/mysecretpassword, db=forever)
#   MinIO       9000  (S3 API)  /  9001  (Web Console)
#   Mailpit     1025  (SMTP)    /  8025  (Web UI)
#
# 与 apps/server/.env.example 中的默认值完全对齐,无需改 .env 即可启动。

services:
  postgres:
    image: postgres:16-alpine
    container_name: forever-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: forever
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: forever-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rustfsadmin
      MINIO_ROOT_PASSWORD: rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MinIO 初始化:创建 forever 桶并设公开读(首次启动时自动执行)
  minio-init:
    image: minio/mc:latest
    container_name: forever-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 rustfsadmin rustfsadmin &&
      mc mb --exists local/forever &&
      mc anonymous set download local/forever &&
      echo 'Bucket forever created with public read.'
      "
    restart: "no"

  mailpit:
    image: axels/mailer:latest
    container_name: forever-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI (查看收到的邮件)
    volumes:
      - mailpitdata:/data

volumes:
  pgdata:
  miniodata:
  mailpitdata:

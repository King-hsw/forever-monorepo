# 配置单一来源：全部 ${ENV:默认值}，**默认值 = 本地开发可用值**（对齐 docker-compose.dev.yml），
# 本地 clone 后直接 `mvn spring-boot:run`，不需要 .env。
#
# 生产不是靠「记得设变量」保障，而是靠 application-prod.yml 把下方这些必填项重新声明为
# 无默认值的 ${VAR}——少一个变量就启动失败（fail fast）。镜像内 SPRING_PROFILES_ACTIVE=prod
# 已在 Dockerfile 里设死，本地 mvn 不带 profile 走的仍是下面的 dev 默认值。
# 同一套变量名：测试机 systemd EnvironmentFile / 生产 compose 自动读取 .env
spring:
  application:
    name: forever-server
  # SMTP 发信（评论通知/启动测试邮件）：本地默认指向 docker-compose.dev.yml 的 Mailpit
  mail:
    host: ${BLOG_MAIL_HOST:localhost}
    port: ${BLOG_MAIL_PORT:1025}
    # 本地账号名兼作发件人地址（MailService 用 mail.username 作 From），必须是合法 email，
    # 否则 Mailpit 回 553 not a valid RFC 5321 address；生产为真实 SMTP 账号
    username: ${BLOG_MAIL_USERNAME:dev@example.com}
    password: ${BLOG_MAIL_PASSWORD:dev}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            # 本地 Mailpit(1025) 是明文连接，默认关；生产 465 隐式 TLS 由 application-prod.yml 打开
            enable: ${BLOG_MAIL_SSL_ENABLE:false}
          # 防止 SMTP 不可达时启动测试邮件/评论通知长时间挂起
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000
  # 动态媒体上传：单文件 120MB（视频 100MB 上限留余量）/ 单请求 130MB
  servlet:
    multipart:
      max-file-size: 120MB
      max-request-size: 130MB
  # 数据源：默认本地 PostgreSQL，生产/测试用 SPRING_DATASOURCE_* 环境变量覆盖
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/forever}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:mysecretpassword}
  # AI 概要：OpenAI 兼容接口（starter 自动装配 OpenAiChatModel Bean）；API Key 留空 = 功能关闭
  ai:
    openai:
      # base-url 原样使用（请求路径 = {base-url}/chat/completions，2.0.1 不会自动补 /v1），兼容端点需自带
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${SPRING_AI_OPENAI_API_KEY:}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:gpt-4o-mini}
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
blog:
  site:
    # 站点名称（邮件 From 显示名、RSS 标题等对外署名）；默认本地站点名，生产必须覆盖
    name: ${BLOG_SITE_NAME:补陋阁}
    # 站点对外地址（邮件绝对链接、RSS、文章 url 字段）；留空 = 邮件降级无链接、文章 url 为 null
    url: ${BLOG_SITE_URL:}
  mail:
    # 启动测试邮件收件人：服务启动即发一封，验证 SMTP 链路，失败只记日志不阻塞启动（本地进 Mailpit :8025）
    # 默认域用 example.com：Mailpit 会拒 `@localhost`（553 不是合法 RFC 5321 地址）
    test-to: ${BLOG_MAIL_TO:dev@example.com}
    # 评论通知站长收件人
    notify-to: ${BLOG_MAIL_NOTIFY_TO:dev@example.com}
  # 初始管理员：仅 sys_user 表为空时用于建号；默认 dev/dev，生产由 application-prod.yml 恢复为必填
  admin:
    username: ${BLOG_ADMIN_USERNAME:dev}
    password: ${BLOG_ADMIN_PASSWORD:dev}
  # 文件存储（RustFS，S3 兼容）：默认对齐 docker-compose.dev.yml；生产必填项见 application-prod.yml
  storage:
    # 浏览器可达的 S3 API 地址（预签名 URL 由浏览器直连）
    endpoint: ${BLOG_STORAGE_ENDPOINT:http://localhost:9000}
    # 公开直链域名（CDN），留空用 endpoint
    public-base-url: ${BLOG_STORAGE_PUBLIC_BASE_URL:}
    access-key: ${BLOG_STORAGE_ACCESS_KEY:rustfsadmin}
    secret-key: ${BLOG_STORAGE_SECRET_KEY:rustfsadmin}
    bucket: ${BLOG_STORAGE_BUCKET:forever}
    # 预签名 URL 有效期（直传 PUT 与分片共用）
    presign-ttl: ${BLOG_STORAGE_PRESIGN_TTL:15m}
  # 高德 Web Service key（动态页「获取当前位置」逆地理）；留空 = 功能关闭
  moments:
    amap:
      key: ${BLOG_MOMENTS_AMAP_KEY:}
# 说明：评论策略等运行参数在后台「站点设置」（PUT /api/admin/settings）
# 在线调整、即时生效，yml 不承载运行参数
forever:
  auth:
    # 父域 cookie Domain 配置：生产设为 .<父域>（如 .example.com），本地留空（localhost 跨端口共享）
    cookie-domain: ${AUTH_COOKIE_DOMAIN:}
    # refresh cookie 的 Secure 属性：本地是 HTTP（含局域网 IP），默认关，否则浏览器丢弃 cookie；
    # 生产 https 由 application-prod.yml 恢复为 true
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
